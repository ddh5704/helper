<app-dialog-title title="Login"></app-dialog-title>
<form [formGroup]="form" class="form-container">
  <mat-form-field appearance="outline" class="form-field full-width">
    <mat-label>Email</mat-label>
    <input matInput formControlName="email" type="email" required placeholder="ex. abc@123.com" />
    <mat-error *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
      Please enter a valid email.
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field full-width">
    <mat-label>Password</mat-label>
    <input matInput formControlName="password" type="password" required />
    <mat-error *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
      Password is required.
    </mat-error>
  </mat-form-field>
  <div class="forgot-password">
    <a (click)="onForgotPassword()" href="javascript: void(0);">Forgot password?</a>
  </div>
  <app-dialog-actions actionLabel="Login" (action)="onSubmit()" (cancel)="onCancel()"></app-dialog-actions>
</form>
